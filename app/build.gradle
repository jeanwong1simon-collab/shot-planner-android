plugins {
    id 'com.android.application'
}

def stableKeystorePath = System.getenv('SHOTLIST_KEYSTORE_PATH')
def stableSigningPassword = System.getenv('SHOTLIST_SIGNING_PASSWORD')
def stableKeystore = stableKeystorePath ? file(stableKeystorePath) : null
def hasStableSigning = stableKeystore != null && stableKeystore.exists() && stableSigningPassword

android {
    namespace 'com.local.shotlist'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.shotlist'
        minSdk 26
        targetSdk 35
        versionCode 117
        versionName '1.1.7'
    }

    signingConfigs {
        stable {
            if (hasStableSigning) {
                storeFile stableKeystore
                storePassword stableSigningPassword
                keyAlias 'shotlist'
                keyPassword stableSigningPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasStableSigning) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
            if (hasStableSigning) {
                signingConfig signingConfigs.stable
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
