plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.shotlist'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.shotlist'
        minSdk 26
        targetSdk 35
        versionCode 113
        versionName '1.1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
